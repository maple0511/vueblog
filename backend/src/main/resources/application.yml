spring:
  application:
    name: campusblog
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/campusblog?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DATABASE_USERNAME:campusblog}
    password: ${DATABASE_PASSWORD}
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-hours: ${JWT_EXPIRATION_HOURS:24}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  ai:
    enabled: ${AI_ENABLED:false}
    base-url: ${AI_BASE_URL:https://ws-etymarnalsjn28ue.cn-beijing.maas.aliyuncs.com/compatible-mode/v1}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:qwen3.7-plus}
    enable-thinking: ${AI_ENABLE_THINKING:true}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    daily-limit-per-user: ${AI_DAILY_LIMIT_PER_USER:50}
